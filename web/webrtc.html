<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teste WebRTC • RNP to OBS</title>
<style>
:root { color-scheme: dark; font-family: system-ui, sans-serif; }
body { margin: 0; background: #101722; color: #e9eef5; }
header, main { max-width: 1100px; margin: auto; padding: 20px; }
h1 { font-size: 24px; margin: 0 0 10px; }
p { color: #adbccd; line-height: 1.5; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
select, button { padding: 10px; font: inherit; border: 1px solid #62758b; border-radius: 5px; background: #1c293b; color: inherit; }
select { max-width: 100%; } button { cursor: pointer; } button:disabled { opacity: .5; cursor: default; }
video { display: block; width: 100%; max-height: 65vh; background: #080b10; object-fit: contain; }
output { display: block; padding: 12px 0; overflow-wrap: anywhere; }
#metrics { font-variant-numeric: tabular-nums; color: #90d9b3; }
.overlay, .overlay main { background: transparent; padding: 0; max-width: none; }
.overlay header, .overlay .controls, .overlay #metrics { display: none; }
.overlay video { width: 100vw; height: 100vh; max-height: none; background: transparent; }
.overlay #status { position: absolute; top: 0; padding: 5px; background: #101722; }
.overlay.connected #status { display: none; }
</style>
</head>
<body>
<header>
<h1>Receptor WebRTC experimental</h1>
<p>Uma fonte por receptor, no mesmo computador. O vídeo não passa por JPEG/Base64. Áudio individual só aparece quando a sala disponibiliza uma trilha identificável. <a href="/control">Abrir painel</a></p>
</header>
<main>
<div class="controls">
<label for="source">Fonte</label><select id="source"><option value="">Aguardando a sala…</option></select>
<button id="start" disabled>Conectar</button><button id="stop">Parar</button>
<button id="listen" hidden>Ativar áudio</button><button id="copy" disabled>Copiar link para OBS</button>
</div>
<output id="status" role="status" aria-live="polite">Consultando fontes…</output>
<video id="media" autoplay muted playsinline></video>
<output id="metrics">As métricas serão exibidas após conectar.</output>
</main>
<script src="/assets/webrtc-receiver.js"></script>
</body>
</html>
